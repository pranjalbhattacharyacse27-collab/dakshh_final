    function handleMapClick(e, mapName) {
        if(!isAdmin) return;
        e.stopPropagation();
        const match = getMatchById(activeVetoMatchId);
        const v = match.veto;
        if (v.history.some(h => h.map === mapName)) return; 
        const step = VETO_STEPS[v.format][v.history.length];
        if (!step || step.action === 'decider') return; 
        v.history.push({ map: mapName, action: step.action, by: step.by === 't1' ? match.t1.id : match.t2.id });
        if (v.history.length === 6) {
            const remainingMap = VALORANT_MAPS.find(m => !v.history.some(h => h.map === m));
            v.history.push({ map: remainingMap, action: 'decider', by: 'auto' });
        }
        renderVetoModal();
    }

    function renderVetoModal() {
        const match = getMatchById(activeVetoMatchId);
        const v = match.veto;
        document.getElementById('vetoTeam1').innerText = match.t1.name;
        document.getElementById('vetoTeam2').innerText = match.t2.name;
        document.getElementById('btnBo1').className = v.format === 'bo1' ? 'px-4 md:px-5 py-1.5 bg-blue-600 rounded text-white font-black text-xs md:text-sm shadow-[0_0_10px_rgba(37,99,235,0.5)] flex-1 sm:flex-none' : 'px-4 md:px-5 py-1.5 hover:bg-slate-700 rounded text-slate-400 font-bold text-xs md:text-sm flex-1 sm:flex-none';
        document.getElementById('btnBo3').className = v.format === 'bo3' ? 'px-4 md:px-5 py-1.5 bg-blue-600 rounded text-white font-black text-xs md:text-sm shadow-[0_0_10px_rgba(37,99,235,0.5)] flex-1 sm:flex-none' : 'px-4 md:px-5 py-1.5 hover:bg-slate-700 rounded text-slate-400 font-bold text-xs md:text-sm flex-1 sm:flex-none';
        
        const statusEl = document.getElementById('vetoStatus');
        if (v.history.length < 7) {
            const step = VETO_STEPS[v.format][v.history.length];
            const tName = step.by === 't1' ? `<span class="text-blue-400">${match.t1.name}</span>` : `<span class="text-red-400">${match.t2.name}</span>`;
            statusEl.innerHTML = `${tName} <span class="text-slate-400 font-medium ml-2">${step.action === 'ban'?'BAN':'PICK'} MAP</span>`;
        } else {
            statusEl.innerHTML = `<span class="text-emerald-400 drop-shadow-[0_0_5px_rgba(16,185,129,0.5)]">VETO COMPLETE</span>`;
        }
        
        document.getElementById('vetoMapsGrid').innerHTML = VALORANT_MAPS.map(map => {
            const hIndex = v.history.findIndex(h => h.map === map);
            const hItem = hIndex !== -1 ? v.history[hIndex] : null;
            const stepNum = hItem ? `<div class="absolute top-2 left-2 md:left-3 text-xs md:text-sm font-black text-slate-100 z-20 drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">#${hIndex + 1}</div>` : '';
            let bClass = "group h-24 md:h-32 flex items-center justify-center rounded-xl border-2 font-black text-base md:text-2xl uppercase tracking-widest transition-all relative overflow-hidden ";
            let overlay = "";
            if (!hItem) { bClass += "border-slate-700 bg-slate-900 text-slate-300 hover:border-blue-500 hover:text-white hover:scale-[1.02] cursor-pointer shadow-lg"; }
            else if (hItem.action === 'ban') { const bName = hItem.by === match.t1.id ? match.t1.tag||match.t1.name.substring(0,3) : match.t2.tag||match.t2.name.substring(0,3); bClass += "border-red-600/50 bg-slate-900 text-red-500 opacity-60 cursor-not-allowed"; overlay = `<div class="absolute inset-0 flex items-center justify-center z-20"><div class="w-[120%] h-1 bg-red-600 rotate-[20deg] opacity-70"></div></div><div class="absolute bottom-1 md:bottom-2 bg-red-900/90 px-2 py-0.5 rounded text-[9px] md:text-xs text-red-100 border border-red-500/50 z-20 drop-shadow-md">BANNED: ${bName.toUpperCase()}</div>`; }
            else if (hItem.action === 'pick') { const bName = hItem.by === match.t1.id ? match.t1.tag||match.t1.name.substring(0,3) : match.t2.tag||match.t2.name.substring(0,3); bClass += "border-emerald-500 bg-slate-900 text-emerald-400 cursor-not-allowed shadow-[0_0_20px_rgba(16,185,129,0.3)]"; overlay = `<div class="absolute bottom-1 md:bottom-2 bg-emerald-900/90 px-2 py-0.5 rounded text-[9px] md:text-xs text-emerald-100 border border-emerald-500/50 z-20 drop-shadow-md">PICKED: ${bName.toUpperCase()}</div>`; }
            else if (hItem.action === 'decider') { bClass += "border-yellow-500 bg-slate-900 text-yellow-400 cursor-not-allowed shadow-[0_0_20px_rgba(234,179,8,0.3)] scale-[1.02]"; overlay = `<div class="absolute bottom-1 md:bottom-2 bg-yellow-900/90 px-2 py-0.5 rounded text-[9px] md:text-xs text-yellow-100 border border-yellow-500/50 tracking-widest z-20 drop-shadow-md">DECIDER</div>`; }
            return `<div onclick="handleMapClick(event, '${map}')" class="${bClass}"><div class="absolute inset-0 bg-cover bg-center opacity-30 grayscale mix-blend-luminosity transition-all duration-300 group-hover:opacity-60 group-hover:grayscale-0" style="background-image: url('${MAP_IMAGES[map]}');"></div><div class="absolute inset-0 bg-slate-950/50"></div>${stepNum}<span class="z-10 drop-shadow-[0_3px_3px_rgba(0,0,0,1)]">${map}</span>${overlay}</div>`;
        }).join('');
    }

    function generatePairings(poolTeams, poolKey, label) {
        let pairings = [];
        let teamsToPair = [...poolTeams];
        while (teamsToPair.length > 1) {
            const teamA = teamsToPair.shift();
            let oppIndex = -1;
            
            let pref = Math.floor(teamsToPair.length / 2);
            for(let offset = 0; offset <= teamsToPair.length; offset++) {
                if (pref + offset < teamsToPair.length && !teamA.history.includes(teamsToPair[pref + offset].id)) { oppIndex = pref + offset; break; }
                if (pref - offset >= 0 && !teamA.history.includes(teamsToPair[pref - offset].id)) { oppIndex = pref - offset; break; }
            }
            if (oppIndex === -1) oppIndex = 0; 
            
            const opponent = teamsToPair.splice(oppIndex, 1)[0];
            pairings.push({
                id: 'match_' + Date.now() + Math.random(),
                t1: teamA, t2: opponent, winnerId: null, scoreT1: 0, scoreT2: 0,
                type: 'swiss', phase: 'swiss', pool: poolKey, label: label
            });
        }
        return pairings;
    }

    function resolveSwingTeams() {
        const realTeams = getSortedTeams().filter(t => !t.isSwing);
        realTeams.forEach((t, i) => {
            if (i < 5) t.status = 'qualified';
            else if (i < 10) t.status = 'league';
            else t.status = 'eliminated';
        });
        teams.filter(t => t.isSwing).forEach(t => t.status = 'eliminated_swing');
    }

    function advanceTournament() {
        if(!isAdmin) return;
        preserveInputs();
        
        if (tournamentFormat === 'standard') {
            if (phase === 'swiss') {
                if (teams.length === 0) return;
                const qualifiedTeams = teams.filter(t => t.status === 'qualified');
                const activeTeams = teams.filter(t => t.status === 'active');
                
                if (activeTeams.length === 0 && qualifiedTeams.length === 8) {
                    phase = 'playoffs'; viewPhase = 'playoffs';
                    const qTeams = getSortedTeams().filter(t => t.status === 'qualified');
                    playoffMatches.qf = [createPlayoffMatch(qTeams[0], qTeams[7], 'Quarterfinal 1'), createPlayoffMatch(qTeams[3], qTeams[4], 'Quarterfinal 2'), createPlayoffMatch(qTeams[1], qTeams[6], 'Quarterfinal 3'), createPlayoffMatch(qTeams[2], qTeams[5], 'Quarterfinal 4')];
                } else {
                    if (matches.some(m => m.type === 'swiss' && m.label === `Swiss Round ${currentRound}` && !m.winnerId)) {
                        alert("Finish all active matches before starting the next round."); return;
                    }
                    if (activeTeams.length % 2 !== 0) return;
                    
                    currentRound++;
                    const sortedActive = getSortedTeams().filter(t => t.status === 'active');
                    
                    const pools = {};
                    sortedActive.forEach(t => {
                        const poolKey = `${t.wins}-${t.losses}`;
                        if (!pools[poolKey]) pools[poolKey] = [];
                        pools[poolKey].push(t);
                    });

                    const newPairings = [];
                    for (const poolKey in pools) {
                        newPairings.push(...generatePairings(pools[poolKey], poolKey, `Swiss Round ${currentRound}`));
                    }
                    matches = [...matches, ...newPairings];
                }
            } else {
                const qf = playoffMatches.qf || [];
                const sf = playoffMatches.sf || [];
                if (qf.length === 4 && qf.every(m => m && m.winnerId) && sf.length === 0) {
                    const w = qf.map(m => teams.find(t => t.id === m.winnerId));
                    playoffMatches.sf = [createPlayoffMatch(w[0], w[1], 'Semifinal 1'), createPlayoffMatch(w[2], w[3], 'Semifinal 2')];
                } 
                else if (sf.length === 2 && sf.every(m => m && m.winnerId) && !playoffMatches.final) {
                    const m1 = sf[0], m2 = sf[1];
                    const f1 = teams.find(t => t.id === m1.winnerId), f2 = teams.find(t => t.id === m2.winnerId);
                    const l1 = teams.find(t => t.id === (m1.winnerId === m1.t1.id ? m1.t2.id : m1.t1.id)), l2 = teams.find(t => t.id === (m2.winnerId === m2.t1.id ? m2.t2.id : m2.t1.id));
                    playoffMatches.final = createPlayoffMatch(f1, f2, 'Grand Final');
                    playoffMatches.third = createPlayoffMatch(l1, l2, '3rd Place Match');
                }
            }
        } else if (tournamentFormat === 'modified') {
            if (phase === 'swiss') {
                if (teams.length === 0) return;
                if (matches.some(m => m.phase === 'swiss' && m.label === `Swiss Round ${currentRound}` && !m.winnerId)) {
                    alert("Finish all active matches before advancing."); return;
                }

                if (currentRound === 0) {
                    currentRound = 1;
                    const allT = getSortedTeams();
                    matches = [...matches, ...generatePairings(allT, '0-0', 'Swiss Round 1')];
                } else if (currentRound === 1) {
                    currentRound = 2;
                    const w1 = getSortedTeams().filter(t => t.wins === 1);
                    const l1 = getSortedTeams().filter(t => t.losses === 1);
                    matches = [...matches, ...generatePairings(w1, '1-0', 'Swiss Round 2'), ...generatePairings(l1, '0-1', 'Swiss Round 2')];
                } else if (currentRound === 2) {
                    currentRound = 3;
                    const tied = getSortedTeams().filter(t => t.wins === 1 && t.losses === 1);
                    matches = [...matches, ...generatePairings(tied, '1-1', 'Swiss Round 3')];
                } else if (currentRound === 3) {
                    resolveSwingTeams();
                    phase = 'league'; viewPhase = 'league';
                    
                    const pTeams = getSortedTeams().filter(t => t.status === 'league');
                    pTeams.forEach((t, i) => t.playinSeed = i + 1); 

                    matches.push({
                        id: 'playin_M1_' + Date.now(), t1: pTeams[3], t2: pTeams[4], winnerId: null, scoreT1: 0, scoreT2: 0,
                        phase: 'league', type: 'league', label: 'Match 1 (Elim)', playinId: 'M1'
                    });
                    matches.push({
                        id: 'playin_M3_' + Date.now(), t1: pTeams[1], t2: pTeams[2], winnerId: null, scoreT1: 0, scoreT2: 0,
                        phase: 'league', type: 'league', label: 'Match 3 (Qual)', playinId: 'M3'
                    });
                }
            } else if (phase === 'league') {
                const m1 = matches.find(m => m.playinId === 'M1');
                const m2 = matches.find(m => m.playinId === 'M2');
                const m3 = matches.find(m => m.playinId === 'M3');
                const m4 = matches.find(m => m.playinId === 'M4');

                if (m1 && m1.winnerId && !m2) {
                    const seed1 = teams.find(t => t.playinSeed === 1);
                    const m1Winner = teams.find(t => t.id === m1.winnerId);
                    matches.push({
                        id: 'playin_M2_' + Date.now(), t1: seed1, t2: m1Winner, winnerId: null, scoreT1: 0, scoreT2: 0,
                        phase: 'league', type: 'league', label: 'Match 2 (Qual)', playinId: 'M2'
                    });
                    commitState(); return;
                }

                if (m2 && m2.winnerId && m3 && m3.winnerId && !m4) {
                    const m2Loser = teams.find(t => t.id === (m2.winnerId === m2.t1.id ? m2.t2.id : m2.t1.id));
                    const m3Loser = teams.find(t => t.id === (m3.winnerId === m3.t1.id ? m3.t2.id : m3.t1.id));
                    matches.push({
                        id: 'playin_M4_' + Date.now(), t1: m2Loser, t2: m3Loser, winnerId: null, scoreT1: 0, scoreT2: 0,
                        phase: 'league', type: 'league', label: 'Match 4 (Last Chance)', playinId: 'M4'
                    });
                    commitState(); return;
                }

                if (m4 && m4.winnerId) {
                    const m2Winner = teams.find(t => t.id === m2.winnerId);
                    const m3Winner = teams.find(t => t.id === m3.winnerId);
                    const m4Winner = teams.find(t => t.id === m4.winnerId);

                    m2Winner.status = 'qualified_league'; m2Winner.leagueRank = 1;
                    m3Winner.status = 'qualified_league'; m3Winner.leagueRank = 2;
                    m4Winner.status = 'qualified_league'; m4Winner.leagueRank = 3;

                    const m1Loser = teams.find(t => t.id === (m1.winnerId === m1.t1.id ? m1.t2.id : m1.t1.id));
                    const m4Loser = teams.find(t => t.id === (m4.winnerId === m4.t1.id ? m4.t2.id : m4.t1.id));
                    m1Loser.status = 'eliminated_league';
                    m4Loser.status = 'eliminated_league';

                    phase = 'playoffs'; viewPhase = 'playoffs';
                    const qTeams = getSortedTeams().filter(t => t.status === 'qualified'); 
                    
                    playoffMatches.qf = [
                        createPlayoffMatch(qTeams[0], m4Winner, 'Quarterfinal 1'),
                        createPlayoffMatch(qTeams[2], m2Winner, 'Quarterfinal 2'),
                        createPlayoffMatch(qTeams[3], qTeams[4], 'Quarterfinal 3'),
                        createPlayoffMatch(qTeams[1], m3Winner, 'Quarterfinal 4')
                    ];
                    commitState(); return;
                }
                alert("Finish all active Prove It matches before advancing."); return;
            } else {
                const qf = playoffMatches.qf || [];
                const sf = playoffMatches.sf || [];
                if (qf.length === 4 && qf.every(m => m && m.winnerId) && sf.length === 0) {
                    const w = qf.map(m => teams.find(t => t.id === m.winnerId));
                    playoffMatches.sf = [createPlayoffMatch(w[0], w[1], 'Semifinal 1'), createPlayoffMatch(w[2], w[3], 'Semifinal 2')];
                } 
                else if (sf.length === 2 && sf.every(m => m && m.winnerId) && !playoffMatches.final) {
                    const m1 = sf[0], m2 = sf[1];
                    const f1 = teams.find(t => t.id === m1.winnerId), f2 = teams.find(t => t.id === m2.winnerId);
                    const l1 = teams.find(t => t.id === (m1.winnerId === m1.t1.id ? m1.t2.id : m1.t1.id)), l2 = teams.find(t => t.id === (m2.winnerId === m2.t1.id ? m2.t2.id : m2.t1.id));
                    playoffMatches.final = createPlayoffMatch(f1, f2, 'Grand Final');
                    playoffMatches.third = createPlayoffMatch(l1, l2, '3rd Place Match');
                }
            }
        }
        commitState();
    }

    function createPlayoffMatch(t1, t2, label) { return { id: 'p_' + Date.now() + '_' + Math.floor(Math.random() * 10000), t1, t2, winnerId: null, scoreT1: 0, scoreT2: 0, label, type: 'playoff', phase: 'playoffs' }; }

    function processMatchResult(matchId, displayScoreT1, displayScoreT2) {
        let match = getMatchById(matchId);
        if (!match || match.winnerId) return;
        match.winnerId = displayScoreT1 > displayScoreT2 ? match.t1.id : match.t2.id;
        match.scoreT1 = displayScoreT1; match.scoreT2 = displayScoreT2;
        calculateStats(); 
    }

    function submitScoreUI(mId) {
        if(!isAdmin) return;
        preserveInputs();
        const m = getMatchById(mId);
        if (!m.veto || m.veto.history.length < 7) return;
        const playable = m.veto.history.filter(h => h.action === 'pick' || h.action === 'decider');
        let t1Wins = 0, t2Wins = 0;
        let mapScores = [];
        
        for (let i = 0; i < playable.length; i++) {
            if (m.veto.format === 'bo3' && (t1Wins === 2 || t2Wins === 2)) break; 
            
            const s1El = document.getElementById(`s1_${mId}_${i}`);
            const s2El = document.getElementById(`s2_${mId}_${i}`);
            
            if (!s1El || !s2El || s1El.value === '' || s2El.value === '') {
                alert("Please fill in all required map scores!");
                return;
            }
            const s1 = parseInt(s1El.value), s2 = parseInt(s2El.value);
            if (s1 === s2) {
                alert("Ties are not allowed in Valorant. Please resolve the match.");
                return; 
            }
            mapScores.push({ map: playable[i].map, s1, s2 });
            if (s1 > s2) t1Wins++; else t2Wins++;
        }
        
        if (m.veto.format === 'bo1' && t1Wins + t2Wins < 1) return;
        if (m.veto.format === 'bo3' && t1Wins < 2 && t2Wins < 2) return;
        
        m.mapScores = mapScores;
        const displayS1 = m.veto.format === 'bo1' ? mapScores[0].s1 : t1Wins;
        const displayS2 = m.veto.format === 'bo1' ? mapScores[0].s2 : t2Wins;
        
        processMatchResult(mId, displayS1, displayS2);
        commitState(); 
    }

    function autoResolveMatches() {
        if(!isAdmin) return;
        let active = [];
        if (viewPhase === 'swiss') active = matches.filter(m => !m.winnerId && m.label === `Swiss Round ${currentRound}`);
        else if (viewPhase === 'league') active = matches.filter(m => m.phase === 'league' && !m.winnerId);
        else if (viewPhase === 'playoffs') active = [...(playoffMatches.qf||[]), ...(playoffMatches.sf||[]), playoffMatches.final, playoffMatches.third].filter(m => m && !m.winnerId);
        
        if (active.length === 0) {
            alert("No active matches in this view to resolve!");
            return;
        }

        active.forEach(m => {
            let isBo3 = phase === 'playoffs' || phase === 'league' || (m.pool && m.pool.includes('2')) ? true : Math.random() > 0.5;
            if (!m.veto || m.veto.history.length < 7) {
                m.veto = { format: isBo3 ? 'bo3' : 'bo1', history: [] };
                let availableMaps = [...VALORANT_MAPS].sort(() => Math.random() - 0.5);
                VETO_STEPS[m.veto.format].forEach(step => { m.veto.history.push({ map: availableMaps.shift(), action: step.action, by: step.by === 'auto' ? 'auto' : (step.by === 't1' ? m.t1.id : m.t2.id) }); });
            }
            const playable = m.veto.history.filter(h => h.action === 'pick' || h.action === 'decider');
            let t1W = 0, t2W = 0, mScores = [];
            for (let i = 0; i < playable.length; i++) {
                if (m.veto.format === 'bo3' && (t1W === 2 || t2W === 2)) break;
                let s1 = Math.random() > 0.5 ? 13 : Math.floor(Math.random() * 12);
                let s2 = s1 === 13 ? Math.floor(Math.random() * 12) : 13;
                if (Math.random() > 0.95) { s1 = 15; s2 = 13; }
                mScores.push({ map: playable[i].map, s1, s2 });
                if (s1 > s2) t1W++; else t2W++;
            }
            m.mapScores = mScores;
            const displayS1 = m.veto.format === 'bo1' ? mScores[0].s1 : t1W;
            const displayS2 = m.veto.format === 'bo1' ? mScores[0].s2 : t2W;
            
            m.winnerId = displayS1 > displayS2 ? m.t1.id : m.t2.id;
            m.scoreT1 = displayS1; m.scoreT2 = displayS2;
        });
        
        calculateStats(); 
        commitState(); 
    }

    function generateTooltip(m, prefix = '', col = null) {
        if (!m || !m.winnerId || !m.mapScores || m.mapScores.length === 0) return '';
        
        let alignClass = '';
        if (viewPhase === 'playoffs') {
            if (m.label === 'Grand Final' || m.label === '3rd Place Match' || m.label.includes('Semifinal')) alignClass = 'tooltip-left';
            else if (m.label.includes('Quarterfinal')) alignClass = 'tooltip-right';
        } else if (viewPhase === 'league') {
            if (col === 1) alignClass = 'tooltip-right';
            else if (col === 2) alignClass = 'tooltip-left';
        } else {
            if (col === 1) alignClass = 'tooltip-right';  
            else if (col === 6 || col === 4) alignClass = 'tooltip-left';
        }

        const mList = m.mapScores.map((ms, i) => `<div class="flex justify-between items-center gap-6 px-1 py-1.5 whitespace-nowrap border-b border-slate-700/50 last:border-0"><span class="text-slate-400 font-bold uppercase text-[9px] md:text-[11px] w-12 text-left">Map ${i+1}</span><span class="text-white font-black uppercase text-[10px] md:text-xs flex-1 text-center px-2">${ms.map}</span><span class="font-mono text-emerald-400 font-black text-[11px] md:text-sm w-12 text-right">${ms.s1} - ${ms.s2}</span></div>`).join('');
        return `<div id="tooltip_${prefix}${m.id}" class="map-tooltip ${alignClass}"><div class="text-[9px] md:text-[10px] font-black text-emerald-400 border-b border-slate-700 pb-2 mb-2 flex justify-between items-center tracking-widest uppercase shadow-md"><span>Match Summary</span><button type="button" onclick="toggleTooltip(event, '${prefix}${m.id}')" class="close-btn text-slate-500 hover:text-red-400 ml-4 px-1 rounded bg-slate-800 transition-colors pointer-events-auto">✕</button></div><div class="flex flex-col">${mList}</div></div>`;
    }

    function render() {
        document.getElementById('mainTourneyTitle').innerText = tournamentName.toUpperCase();
        document.getElementById('vizTourneyName').innerText = tournamentName.toUpperCase();

        const btn = document.getElementById('mainActionBtn');
        document.getElementById('vizPhaseTag').innerText = viewPhase === 'swiss' ? "SWISS STAGE" : (viewPhase === 'league' ? "PROVE IT STAGE" : "CHAMPIONS STAGE");
        
        if (tournamentFormat === 'modified') {
            document.getElementById('viewToggle').classList.remove('hidden');
            document.getElementById('btnViewLeague').classList.remove('hidden');
            
            document.getElementById('btnViewSwiss').className = viewPhase === 'swiss' ? 'px-3 md:px-4 py-1 bg-blue-600 rounded text-white font-bold text-[10px] md:text-xs shadow-[0_0_10px_rgba(37,99,235,0.5)]' : 'px-3 md:px-4 py-1 hover:bg-slate-700 rounded text-slate-400 font-bold text-[10px] md:text-xs transition-all';
            document.getElementById('btnViewLeague').className = viewPhase === 'league' ? 'px-3 md:px-4 py-1 bg-blue-600 rounded text-white font-bold text-[10px] md:text-xs shadow-[0_0_10px_rgba(37,99,235,0.5)]' : 'px-3 md:px-4 py-1 hover:bg-slate-700 rounded text-slate-400 font-bold text-[10px] md:text-xs transition-all';
            document.getElementById('btnViewPlayoffs').className = viewPhase === 'playoffs' ? 'px-3 md:px-4 py-1 bg-blue-600 rounded text-white font-bold text-[10px] md:text-xs shadow-[0_0_10px_rgba(37,99,235,0.5)]' : 'px-3 md:px-4 py-1 hover:bg-slate-700 rounded text-slate-400 font-bold text-[10px] md:text-xs transition-all';
        } else {
            if (phase === 'playoffs') {
                document.getElementById('viewToggle').classList.remove('hidden');
                document.getElementById('btnViewSwiss').className = viewPhase === 'swiss' ? 'px-3 md:px-4 py-1 bg-blue-600 rounded text-white font-bold text-[10px] md:text-xs shadow-[0_0_10px_rgba(37,99,235,0.5)]' : 'px-3 md:px-4 py-1 hover:bg-slate-700 rounded text-slate-400 font-bold text-[10px] md:text-xs transition-all';
                document.getElementById('btnViewPlayoffs').className = viewPhase === 'playoffs' ? 'px-3 md:px-4 py-1 bg-blue-600 rounded text-white font-bold text-[10px] md:text-xs shadow-[0_0_10px_rgba(37,99,235,0.5)]' : 'px-3 md:px-4 py-1 hover:bg-slate-700 rounded text-slate-400 font-bold text-[10px] md:text-xs transition-all';
            } else {
                document.getElementById('viewToggle').classList.add('hidden');
            }
        }

        if (phase === 'swiss') {
            document.getElementById('phaseTag').innerText = "Swiss Stage";
            document.getElementById('roundDisplay').innerText = currentRound === 0 ? "Setup Phase" : `Round ${currentRound}`;
            const activeTeams = teams.filter(t => t.status === 'active');
            
            if (tournamentFormat === 'modified' && currentRound === 3 && activeTeams.length > 0 && matches.filter(m => m.phase === 'swiss' && !m.winnerId).length === 0) {
                btn.innerText = "START PROVE IT STAGE"; btn.className = "admin-only bg-blue-600 hover:bg-blue-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(37,99,235,0.4)] text-sm md:text-base w-full sm:w-auto";
            } else if (tournamentFormat === 'standard' && activeTeams.length === 0 && teams.length > 0) { 
                btn.innerText = "START CHAMPIONS STAGE"; btn.className = "admin-only bg-yellow-600 hover:bg-yellow-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(202,138,4,0.4)] text-sm md:text-base w-full sm:w-auto"; 
            } else { 
                btn.innerText = "START NEXT ROUND"; btn.className = "admin-only bg-emerald-600 hover:bg-emerald-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(16,185,129,0.4)] text-sm md:text-base w-full sm:w-auto";
            }
        } else if (phase === 'league') {
            document.getElementById('phaseTag').innerText = "Prove It Stage";
            document.getElementById('roundDisplay').innerText = "Play-In Bracket";
            const m4 = matches.find(m => m.playinId === 'M4');
            if (m4 && m4.winnerId) {
                btn.innerText = "START CHAMPIONS STAGE"; btn.className = "admin-only bg-yellow-600 hover:bg-yellow-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(202,138,4,0.4)] text-sm md:text-base w-full sm:w-auto";
            } else {
                btn.innerText = "ADVANCE BRACKET"; btn.className = "admin-only bg-blue-600 hover:bg-blue-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(37,99,235,0.4)] text-sm md:text-base w-full sm:w-auto";
            }
        } else {
            document.getElementById('phaseTag').innerText = "Champions Stage";
            document.getElementById('phaseTag').className = "text-[10px] md:text-xs font-bold uppercase tracking-widest text-yellow-500";
            document.getElementById('roundDisplay').innerText = "Knockout Playoffs";
            btn.innerText = "ADVANCE BRACKET"; btn.className = "admin-only bg-yellow-600 hover:bg-yellow-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(202,138,4,0.4)] text-sm md:text-base w-full sm:w-auto";
        }
        
        renderStandings(); 
        renderMatches(); 
        renderVisualizer();
    }

    function renderStandings() {
        document.getElementById('standingsList').innerHTML = getSortedTeams().map((t, i) => {
            if (t.isSwing && phase !== 'swiss' && currentRound > 0) return ''; 
            
            const mmrObj = t.players && t.players.length ? calculateStackMMR(t.players.map(p => p.rank)) : {mmr: t.initialSeed, predicted: "Unknown"};
            let rosterHtml = t.players && t.players.length ? t.players.map(p => `<div class="flex items-center justify-between gap-3 py-1 border-b border-slate-700/50 last:border-0"><span class="text-xs text-slate-300 font-medium truncate w-24">${p.name}</span><div class="flex items-center gap-1.5 w-24 justify-end"><span class="text-[9px] font-bold text-slate-400 uppercase tracking-wide">${p.rank}</span><img src="${getRankImg(RANK_DATA[p.rank].id)}" class="w-4 h-4" alt="${p.rank}"></div></div>`).join('') : `<div class="text-xs text-slate-500 italic">Roster data unavailable</div>`;
            
            let sClass = 'border-transparent';
            if (t.isSwing) sClass = 'swing-team-row border-amber-500';
            else if (t.status === 'qualified' || t.status === 'qualified_league') sClass = 'qualified border-emerald-500';
            else if (t.status === 'league') sClass = 'league-team border-blue-500';
            else if (t.status.includes('eliminated')) sClass = 'eliminated border-red-500';

            const swingTag = t.isSwing ? `<span class="swing-tag">Swing</span>` : '';
            const tTagDisplay = `<span class="text-[9px] md:text-[10px] font-mono text-slate-500 ml-1">[${(t.tag || t.name.substring(0,3)).toUpperCase()}]</span>`;

            return `<div class="standings-row relative group flex flex-col p-2 md:p-3 border-l-2 ${sClass} hover:bg-slate-800/80 cursor-default transition-colors"><div class="flex items-center justify-between w-full"><div class="flex items-center gap-2 md:gap-3 overflow-hidden"><span class="font-mono text-slate-500 text-[10px] md:text-xs w-3 md:w-4">${i + 1}.</span><div><p class="font-bold text-xs md:text-sm truncate ${t.isSwing ? 'text-amber-300' : (t.status.includes('qualified') ? 'text-emerald-400' : (t.status === 'league' ? 'text-blue-400' : ''))}">${t.name}${tTagDisplay}${swingTag}</p><div class="flex items-center gap-1 mt-0.5">${mmrObj.predicted !== 'Unknown' ? `<img src="${getRankImg(RANK_DATA[mmrObj.predicted].id)}" class="w-3 h-3 md:w-3.5 md:h-3.5 object-contain" alt="">` : ''}<p class="text-[9px] md:text-[10px] text-slate-400 font-medium truncate">Avg: ${mmrObj.predicted}</p></div></div></div><div class="text-right shrink-0 ml-1 md:ml-2"><div class="font-mono font-bold text-xs md:text-sm"><span class="${t.wins>0?'text-emerald-400':'text-slate-400'}">${t.wins}W</span> - <span class="${t.losses>0?'text-red-400':'text-slate-400'}">${t.losses}L</span></div><div class="text-[9px] md:text-[10px] text-slate-400 font-medium">Diff: <span class="${t.roundDiff>0?'text-emerald-500':(t.roundDiff<0?'text-red-500':'')}">${t.roundDiff>0?'+':''}${t.roundDiff}</span></div></div></div>
            <div class="team-roster-panel hidden group-hover:block mt-3 pt-2 border-t border-slate-700/50 w-full animate-fadeIn"><div class="text-[9px] font-black ${t.isSwing ? 'text-amber-400' : 'text-blue-400'} pb-1 flex justify-between items-center tracking-widest uppercase border-b border-slate-700/50 mb-2"><span>Roster</span><span class="text-[8px] ${t.isSwing ? 'bg-amber-900/50 text-amber-300 border-amber-500/30' : 'bg-blue-900/30 text-blue-300 border-blue-500/30'} px-1.5 py-0.5 rounded border shrink-0">MMR: ${mmrObj.mmr}</span></div><div class="flex flex-col gap-1">${rosterHtml}</div></div></div>`;
        }).join('');
    }

    function renderMatches() {
        const grid = document.getElementById('matchGrid');
        if (viewPhase === 'swiss') {
            const activeMatches = matches.filter(m => !m.winnerId && m.label === `Swiss Round ${currentRound}`);
            grid.innerHTML = activeMatches.length ? activeMatches.map(m => generateMatchCardHTML(m)).join('') : (teams.length ? `<div class="col-span-full p-8 md:p-12 text-center border-2 border-dashed border-slate-700/50 rounded-2xl md:rounded-3xl bg-slate-900/30 text-slate-400 text-sm md:text-base">All matches in this round complete.</div>` : `<div class="col-span-full p-8 md:p-12 text-center border-2 border-dashed border-slate-700/50 rounded-2xl md:rounded-3xl bg-slate-900/30 text-slate-400 text-sm md:text-base">Awaiting Teams</div>`);
        } else if (viewPhase === 'league') {
            const activeMatches = matches.filter(m => m.phase === 'league' && !m.winnerId);
            grid.innerHTML = activeMatches.length ? activeMatches.map(m => generateMatchCardHTML(m)).join('') : (matches.some(m => m.phase === 'league') ? `<div class="col-span-full p-8 md:p-12 text-center border-2 border-dashed border-slate-700/50 rounded-2xl md:rounded-3xl bg-slate-900/30 text-slate-400 text-sm md:text-base">All Prove It matches complete.</div>` : `<div class="col-span-full p-8 md:p-12 text-center border-2 border-dashed border-slate-700/50 rounded-2xl md:rounded-3xl bg-slate-900/30 text-slate-400 text-sm md:text-base">Play-In not started yet.</div>`);
        } else {
            const qfHtml = playoffMatches.qf && playoffMatches.qf.length > 0 ? renderPlayoffTier('Quarterfinals', playoffMatches.qf) : '';
            const sfHtml = playoffMatches.sf && playoffMatches.sf.length > 0 ? renderPlayoffTier('Semifinals', playoffMatches.sf) : '';
            const finalHtml = playoffMatches.final ? renderPlayoffTier('Finals', [playoffMatches.final, playoffMatches.third]) : '';
            grid.innerHTML = `<div class="col-span-full space-y-4 md:space-y-6">${qfHtml}${sfHtml}${finalHtml}</div>`;
        }
    }

    function renderPlayoffTier(title, matchArray) {
        if (!matchArray || !matchArray.length) return '';
        return `<h3 class="text-base md:text-lg font-black text-yellow-500 uppercase tracking-widest border-b border-slate-800 pb-1.5 md:pb-2 mb-3 md:mb-4">${title}</h3><div class="grid grid-cols-1 xl:grid-cols-2 gap-3 md:gap-4">` + matchArray.map(m => generateMatchCardHTML(m, true)).join('') + `</div>`;
    }

    function generateMatchCardHTML(m, isPlayoff = false) {
        if (!m || !m.t1 || !m.t2) return `<div class="col-span-1 p-6 md:p-8 text-center border-2 border-dashed border-slate-700/50 rounded-xl shadow-lg bg-slate-900/30 text-slate-500 font-bold uppercase tracking-widest">TBD</div>`;

        let accent = isPlayoff ? 'from-yellow-600 to-orange-500' : (m.phase === 'league' ? 'from-blue-600 to-purple-500' : 'from-blue-500 to-emerald-500');
        if (m.t1.isSwing || m.t2.isSwing) accent = 'from-amber-600 to-yellow-400';

        let vetoUI = '';
        if (m.veto && m.veto.history.length === 7) {
            let pickCount = 1;
            const picks = m.veto.history.filter(h => h.action === 'pick' || h.action === 'decider');
            vetoUI = `<div class="mt-2 flex gap-1 justify-center flex-wrap">` + picks.map(p => { const isDec = p.action === 'decider'; const color = isDec ? 'text-yellow-400 border-yellow-500/50 bg-yellow-900/20' : 'text-emerald-400 border-emerald-500/50 bg-emerald-900/20'; const prefix = isDec ? (m.veto.format === 'bo1' ? 'MAP' : 'DEC') : `M${pickCount++}`; return `<span class="text-[8px] md:text-[9px] font-bold px-1.5 py-0.5 rounded border flex items-center gap-1 ${color}"><span class="opacity-70">${prefix}</span> ${p.map.toUpperCase()}</span>`; }).join('') + `</div>`;
        } else if (m.veto && m.veto.history.length > 0) {
            vetoUI = `<div class="mt-2 text-[8px] md:text-[9px] text-center text-slate-500 uppercase font-bold tracking-widest">Veto in progress...</div>`;
        }

        let controlUI = '';
        if (m.winnerId) {
            controlUI = `<div class="flex items-center gap-2 md:gap-3 cursor-pointer hover:bg-slate-800/80 p-2 rounded-lg transition-colors" onclick="toggleTooltip(event, 'grid_${m.id}')" title="Click to pin map scores"><span class="text-2xl md:text-3xl font-black ${m.winnerId===m.t1.id?'text-emerald-400':'text-slate-500'}">${m.scoreT1}</span><span class="text-slate-600 font-bold">-</span><span class="text-2xl md:text-3xl font-black ${m.winnerId===m.t2.id?'text-emerald-400':'text-slate-500'}">${m.scoreT2}</span></div><div class="mt-1 md:mt-2 text-[9px] md:text-[10px] text-slate-500 uppercase font-bold bg-slate-950/50 px-3 py-1.5 rounded shadow-inner cursor-pointer hover:text-white transition-colors" onclick="toggleTooltip(event, 'grid_${m.id}')">Map Results</div>`;
        } else if (m.veto && m.veto.history.length === 7) {
            const playable = m.veto.history.filter(h => h.action === 'pick' || h.action === 'decider');
            const inputs = playable.map((p, idx) => `<div class="flex items-center justify-between gap-1 md:gap-2 w-full text-[9px] md:text-[10px] mb-1 md:mb-2"><span class="text-slate-400 w-10 md:w-16 truncate uppercase font-bold" title="${p.map}">${p.map}</span><input id="s1_${m.id}_${idx}" type="number" min="0" value="${m['tempS1_'+idx] !== undefined ? m['tempS1_'+idx] : ''}" class="admin-only w-12 md:w-16 bg-slate-800 border border-slate-600 rounded text-center py-2 text-sm md:text-base font-black outline-none appearance-none focus:border-blue-500 transition-colors shadow-inner text-white"><span class="text-slate-600 font-bold">:</span><input id="s2_${m.id}_${idx}" type="number" min="0" value="${m['tempS2_'+idx] !== undefined ? m['tempS2_'+idx] : ''}" class="admin-only w-12 md:w-16 bg-slate-800 border border-slate-600 rounded text-center py-2 text-sm md:text-base font-black outline-none appearance-none focus:border-blue-500 transition-colors shadow-inner text-white"></div>`).join('');
            controlUI = `<div class="flex flex-col w-full px-1">${inputs}</div><button type="button" onclick="submitScoreUI('${m.id}')" class="admin-only mt-2 md:mt-3 bg-emerald-700 hover:bg-emerald-600 text-[10px] md:text-[11px] font-bold px-4 py-2 md:py-2.5 rounded transition-colors w-full border border-emerald-600 uppercase shadow-lg text-white">Submit Match</button>`;
        } else {
            controlUI = `<div class="text-[10px] md:text-[11px] text-slate-400 text-center mb-2 md:mb-3 italic">Veto Required</div><button type="button" onclick="openVetoModal('${m.id}')" class="admin-only bg-blue-600 hover:bg-blue-500 text-[11px] md:text-[12px] font-bold text-white px-4 py-2 md:py-2.5 rounded transition-colors border border-blue-500 uppercase shadow-lg w-full">Start Veto</button>`;
        }

        const t1Swing = m.t1.isSwing ? `<span class="text-amber-400 text-[8px] font-black uppercase ml-1">(Swing)</span>` : '';
        const t2Swing = m.t2.isSwing ? `<span class="text-amber-400 text-[8px] font-black uppercase mr-1">(Swing)</span>` : '';

        return `<div class="glass-panel border ${m.t1.isSwing || m.t2.isSwing ? 'border-amber-700/50' : (m.winnerId?'border-slate-800 opacity-70':'border-slate-700 hover:border-slate-500')} p-3 md:p-5 rounded-xl shadow-xl relative overflow-visible group"><div class="absolute top-0 left-0 w-full h-1 rounded-t-xl bg-gradient-to-r ${accent} opacity-75"></div><div class="text-[9px] md:text-[11px] text-center text-slate-400 font-bold mb-3 md:mb-4 uppercase tracking-widest">${m.label}</div><div class="flex items-center justify-between gap-3 md:gap-6 flex-wrap md:flex-nowrap"><div class="w-full md:flex-1 text-center md:text-right truncate font-bold text-base md:text-lg ${m.t1.isSwing ? 'text-amber-300' : (m.winnerId===m.t1.id?'text-white':'text-slate-400')}">${m.t1.name}${t1Swing} <span class="text-[9px] md:text-[10px] text-slate-500 font-mono hidden md:inline ml-2">${(m.t1.tag || m.t1.name.substring(0,3)).toUpperCase()}</span></div><div class="flex flex-col items-center shrink-0 w-full md:w-52 order-last md:order-none mt-2 md:mt-0">${controlUI}</div><div class="w-full md:flex-1 text-center md:text-left truncate font-bold text-base md:text-lg ${m.t2.isSwing ? 'text-amber-300' : (m.winnerId===m.t2.id?'text-white':'text-slate-400')}"><span class="text-[9px] md:text-[10px] text-slate-500 font-mono hidden md:inline mr-2">${(m.t2.tag || m.t2.name.substring(0,3)).toUpperCase()}</span> ${t2Swing}${m.t2.name}</div></div>${generateTooltip(m, 'grid_')}</div>`;
    }

    function getPos(col, row, isModified = false, layout = 'swiss') { 
        if (layout === 'league') {
            return { x: `${(col - 0.5) * (100 / 4)}%`, y: `${(row - 0.5) * (100 / 5)}%` };
        } else if (layout === 'playoffs') {
            return { x: `${(col - 0.5) * (100 / 4)}%`, y: `${(row - 0.5) * (100 / 8)}%` };
        }
        
        if (isModified) {
            return { x: `${(col - 0.5) * (100 / 4)}%`, y: `${(row - 0.5) * (100 / 5)}%` }; 
        }
        return { x: `${(col - 0.5) * (100 / 6)}%`, y: `${(row - 0.5) * (100 / 7)}%` }; 
    }

    function renderVisualizer() {
        const vc = document.getElementById('visualizerContainer');
        if (teams.length === 0) { vc.innerHTML = `<div class="m-auto text-slate-500 italic font-medium text-sm tracking-wide">Awaiting Tournament Data...</div>`; return; }
        
        if (viewPhase === 'swiss') {
            let vizRound = currentRound;
            const activeSwissMatches = matches.filter(m => m.type === 'swiss' && !m.winnerId);
            if (currentRound > 0 && activeSwissMatches.length === 0) vizRound = currentRound + 1; 
            
            const isMod = tournamentFormat === 'modified';
            let connections = [];
            if (isMod) {
                connections = [
                    {from:[1,3],to:[2,2],win:true}, {from:[1,3],to:[2,4],win:false},
                    {from:[2,2],to:[3,1],win:true}, {from:[2,2],to:[3,3],win:false},
                    {from:[2,4],to:[3,3],win:true}, {from:[2,4],to:[3,5],win:false},
                    {from:[3,3],to:[4,2],win:true}, {from:[3,3],to:[4,4],win:false}
                ];
            } else {
                connections = [
                    {from:[1,4],to:[2,3],win:true}, {from:[1,4],to:[2,5],win:false},
                    {from:[2,3],to:[3,2],win:true}, {from:[2,3],to:[3,4],win:false},
                    {from:[2,5],to:[3,4],win:true}, {from:[2,5],to:[3,6],win:false},
                    {from:[3,2],to:[4,1],win:true}, {from:[3,2],to:[4,3],win:false},
                    {from:[3,4],to:[4,3],win:true}, {from:[3,4],to:[4,5],win:false},
                    {from:[3,6],to:[4,5],win:true}, {from:[3,6],to:[4,7],win:false},
                    {from:[4,3],to:[5,2],win:true}, {from:[4,3],to:[5,4],win:false},
                    {from:[4,5],to:[5,4],win:true}, {from:[4,5],to:[5,6],win:false},
                    {from:[5,4],to:[6,3],win:true}, {from:[5,4],to:[6,5],win:false}
                ];
            }
            
            let svgLines = `<div class="absolute inset-0 pointer-events-none z-0"><svg class="w-full h-full">`;
            connections.forEach(c => { if (vizRound >= c.to[0]) { const p1 = getPos(c.from[0], c.from[1], isMod, 'swiss'), p2 = getPos(c.to[0], c.to[1], isMod, 'swiss'); svgLines += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" class="${c.win ? 'flow-line-win' : 'flow-line-loss'}" />`; }});
            svgLines += `</svg></div>`;

            let cols = isMod ? 4 : 6;
            let rows = isMod ? 5 : 7;
            let html = `<div class="grid gap-x-2 sm:gap-x-5 gap-y-1 sm:gap-y-3 min-w-[750px] sm:min-w-[1000px] h-full min-h-[400px] w-full px-2 relative mx-auto z-10" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr);">` + svgLines;
            
            const getMatches = (poolStr) => matches.filter(m => m.type === 'swiss' && m.pool === poolStr);
            const getTeams = (w, l) => teams.filter(t => t.wins === w && t.losses === l && !t.isSwing);
            
            let blocks = [];
            if (isMod) {
                blocks = [
                    { type: 'match', pool: '0-0', title: '0:0', c: 1, r: 3, color: 'border-[#4b5563] shadow-[0_0_12px_rgba(75,85,99,0.3)] text-slate-300' },
                    { type: 'match', pool: '1-0', title: '1:0', c: 2, r: 2, color: 'border-[#22c55e] shadow-[0_0_12px_rgba(34,197,94,0.3)] text-[#4ade80]' },
                    { type: 'match', pool: '0-1', title: '0:1', c: 2, r: 4, color: 'border-[#ef4444] shadow-[0_0_12px_rgba(239,68,68,0.3)] text-[#f87171]' },
                    { type: 'result', w: 2, l: 0, title: '2:0 Qualified', c: 3, r: 1, color: 'border-[#22c55e] shadow-[0_0_15px_rgba(34,197,94,0.4)] text-[#4ade80] bg-[#064e3b]/40' },
                    { type: 'match', pool: '1-1', title: '1:1', c: 3, r: 3, color: 'border-[#eab308] shadow-[0_0_12px_rgba(234,179,8,0.3)] text-[#facc15]' },
                    { type: 'result', w: 0, l: 2, title: '0:2 Eliminated', c: 3, r: 5, color: 'border-[#ef4444] shadow-[0_0_15px_rgba(239,68,68,0.4)] text-[#f87171] bg-[#7f1d1d]/40' },
                    { type: 'result', w: 2, l: 1, title: '2:1 League Bound', c: 4, r: 2, color: 'border-[#3b82f6] shadow-[0_0_15px_rgba(59,130,246,0.4)] text-[#60a5fa] bg-[#1e3a8a]/40' },
                    { type: 'result', w: 1, l: 2, title: '1:2 Eliminated', c: 4, r: 4, color: 'border-[#ef4444] shadow-[0_0_15px_rgba(239,68,68,0.4)] text-[#f87171] bg-[#7f1d1d]/40' }
                ];
            } else {
                blocks = [
                    { type: 'match', pool: '0-0', title: '0:0', c: 1, r: 4, color: 'border-[#4b5563] shadow-[0_0_12px_rgba(75,85,99,0.3)] text-slate-300' },
                    { type: 'match', pool: '1-0', title: '1:0', c: 2, r: 3, color: 'border-[#22c55e] shadow-[0_0_12px_rgba(34,197,94,0.3)] text-[#4ade80]' },
                    { type: 'match', pool: '0-1', title: '0:1', c: 2, r: 5, color: 'border-[#ef4444] shadow-[0_0_12px_rgba(239,68,68,0.3)] text-[#f87171]' },

                const second = teams.find(t => t.id === (playoffMatches.final.t1.id === playoffMatches.final.winnerId ? playoffMatches.final.t2.id : playoffMatches.final.t1.id));
                const third = teams.find(t => t.id === playoffMatches.third.winnerId);
                
                html += `
                <div class="flex flex-col justify-end items-center h-full pl-8 ml-4 min-w-[200px] pb-4 z-10" style="grid-column: 4; grid-row: 1 / 9;">
                    <h3 class="text-lg md:text-xl font-black text-white mb-4 md:mb-6 tracking-widest uppercase shadow-black drop-shadow-lg">Champions</h3>
                    <div class="flex items-end gap-1 md:gap-2 h-36 md:h-48 mt-auto">
                        <div class="flex flex-col items-center group podium-step w-16 md:w-20" style="animation-delay: 0.2s">
                            <span class="text-slate-300 font-bold text-[10px] md:text-xs mb-1 md:mb-2 truncate max-w-[60px] md:max-w-[80px] text-center w-full" title="${second.name}">${second.name}</span>
                            <div class="w-full bg-gradient-to-t from-slate-500/80 to-slate-300/80 backdrop-blur rounded-t-lg shadow-[0_0_15px_rgba(148,163,184,0.3)] flex items-start justify-center pt-1 md:pt-2 h-20 md:h-24 relative border-t-2 border-slate-200"><span class="text-slate-900 font-black text-xl md:text-2xl">2</span><div class="absolute -top-4 md:-top-5 text-xl md:text-2xl drop-shadow-lg">🥈</div></div>
                        </div>
                        <div class="flex flex-col items-center group z-10 podium-step w-20 md:w-24" style="animation-delay: 0.6s">
                            <span class="text-yellow-400 font-bold text-sm md:text-base mb-1 md:mb-2 drop-shadow-[0_0_8px_rgba(234,179,8,0.8)] truncate max-w-[80px] md:max-w-[100px] text-center w-full" title="${first.name}">${first.name}</span>
                            <div class="w-full bg-gradient-to-t from-yellow-700/80 to-yellow-400/80 backdrop-blur rounded-t-lg shadow-[0_0_30px_rgba(234,179,8,0.5)] flex items-start justify-center pt-1 md:pt-2 h-28 md:h-36 relative border-t-2 border-yellow-200"><span class="text-yellow-900 font-black text-2xl md:text-3xl">1</span><div class="absolute -top-5 md:-top-6 text-3xl md:text-4xl drop-shadow-lg">🏆</div></div>
                        </div>
                        <div class="flex flex-col items-center group podium-step w-16 md:w-20" style="animation-delay: 0.4s">
                            <span class="text-amber-500 font-bold text-[10px] md:text-xs mb-1 md:mb-2 truncate max-w-[60px] md:max-w-[80px] text-center w-full" title="${third.name}">${third.name}</span>
                            <div class="w-full bg-gradient-to-t from-amber-800/80 to-amber-600/80 backdrop-blur rounded-t-lg shadow-[0_0_15px_rgba(217,119,6,0.3)] flex items-start justify-center pt-1 md:pt-2 h-12 md:h-16 relative border-t-2 border-amber-400"><span class="text-amber-950 font-black text-xl md:text-2xl">3</span><div class="absolute -top-3 md:-top-4 text-xl md:text-2xl drop-shadow-lg">🥉</div></div>
                        </div>
                    </div>
                </div>`;
            }

            vc.innerHTML = html + `</div>`;
        }
    }
</script>
</body>
</html>
