<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Swiss Tournament Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.12), transparent 30%),
                radial-gradient(circle at 85% 60%, rgba(59, 130, 246, 0.12), transparent 30%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
        }
        
        .glass-panel { @apply bg-slate-900/80 backdrop-blur-md border border-slate-700/60 shadow-xl; }
        .qualified { @apply bg-emerald-900/40 border-emerald-500/50 text-emerald-100; }
        .eliminated { @apply bg-red-900/40 border-red-500/50 text-red-200 opacity-60; }
        .league-team { @apply bg-blue-900/40 border-blue-500/50 text-blue-100; }
        
        .swing-team-row { @apply bg-amber-950/50 border-amber-600/50 text-amber-100; }
        .swing-tag { @apply bg-amber-500 text-amber-950 font-black text-[9px] px-1.5 py-0.5 rounded ml-2 uppercase tracking-widest; }
        
        #visualizerContainer { overflow-x: auto; overflow-y: visible; padding-bottom: 80px; position: relative; }
        .viz-scroll::-webkit-scrollbar { height: 10px; width: 10px; }
        .viz-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 8px; }
        .viz-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; border: 2px solid rgba(15, 23, 42, 0.8); }
        .viz-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes fadeInLine { from { opacity: 0; } to { opacity: 0.35; } }
        .flow-line-win { stroke: #22c55e; stroke-width: 2.5; stroke-dasharray: 6 6; animation: fadeInLine 0.5s ease-out forwards, flowWin 1s linear infinite; }
        .flow-line-loss { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 6; animation: fadeInLine 0.5s ease-out forwards, flowLoss 1s linear infinite; }
        @keyframes flowWin { to { stroke-dashoffset: -12; } }
        @keyframes flowLoss { to { stroke-dashoffset: -12; } }
        @keyframes riseUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .podium-step { animation: riseUp 0.8s ease-out forwards; }
        @keyframes fadeInFast { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeInFast 0.2s ease-out forwards; }
        @keyframes pulseDot { 0% { opacity: 0.4; } 50% { opacity: 1; box-shadow: 0 0 10px #ef4444; } 100% { opacity: 0.4; } }
        .live-dot { animation: pulseDot 1.5s infinite; }

        .map-tooltip {
            position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(12px); 
            border: 1px solid #475569; border-radius: 8px; padding: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 15px rgba(16, 185, 129, 0.2);
            z-index: 9999; width: max-content; min-width: 180px; 
            opacity: 0; visibility: hidden; transition: all 0.2s ease-out; pointer-events: none;
        }
        .map-tooltip.tooltip-right { left: 0; transform: none; }
        .map-tooltip.tooltip-left { left: auto; right: 0; transform: none; }
        .group:hover > .map-tooltip, .map-tooltip.active { opacity: 1; visibility: visible; bottom: 115%; }
        
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        body.viewer-mode .admin-only { display: none !important; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-2 md:p-6 selection:bg-emerald-500/30 overflow-x-hidden">

<div class="max-w-[1600px] mx-auto space-y-4 md:space-y-6 relative z-10">
    <header class="flex flex-col xl:flex-row justify-between items-center xl:items-end gap-4 border-b border-slate-700/50 pb-4 md:pb-6 text-center xl:text-left">
        <div>
            <h1 class="text-3xl md:text-4xl font-black tracking-tighter leading-none uppercase">
                <span id="mainTourneyTitle" class="text-emerald-500">SWISS TOURNAMENT</span>
            </h1>
            
            <div id="roomCodeContainer" class="hidden flex items-center justify-center xl:justify-start gap-2 mt-3 flex-wrap">
                <div id="liveIndicator" class="hidden items-center gap-1.5 mr-2 bg-slate-900 border border-slate-700 px-2 py-1 rounded">
                    <div class="w-2 h-2 bg-red-500 rounded-full live-dot"></div>
                    <span class="text-red-400 text-[10px] font-black uppercase tracking-widest">Live Sync</span>
                </div>

                <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Room:</span>
                <span id="roomCodeDisplay" class="bg-slate-900 border border-slate-700 px-3 py-1 rounded text-xs font-bold tracking-widest text-emerald-400 select-all"></span>
                
                <span class="admin-only text-slate-400 text-xs font-bold uppercase tracking-widest ml-2">Admin Key:</span>
                <span id="adminKeyDisplay" class="admin-only bg-slate-800 border border-slate-700 px-3 py-1 rounded text-xs font-bold tracking-widest text-transparent hover:text-yellow-400 hover:bg-slate-900 transition-all cursor-help select-all" title="Hover to reveal"></span>

                <button onclick="copyRoomCode()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors p-1.5 rounded text-white shadow-md ml-1" title="Copy Codes">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
                <button onclick="leaveRoom()" class="ml-2 bg-red-900/30 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white transition-colors px-3 py-1 rounded text-xs font-bold uppercase tracking-widest shadow-md">Exit</button>
            </div>
        </div>
        <div class="flex gap-2 flex-wrap justify-center xl:justify-end w-full xl:w-auto">
            <input type="file" id="loadInput" accept=".json" class="hidden" onchange="loadTournament(event)">
            <button type="button" onclick="document.getElementById('loadInput').click()" class="admin-only bg-slate-800/80 backdrop-blur hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm transition-all text-slate-300 shadow-md flex-1 xl:flex-none">📂 Restore Backup</button>
            <button type="button" onclick="saveTournament()" class="bg-slate-800/80 backdrop-blur hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm transition-all text-slate-300 shadow-md flex-1 xl:flex-none">💾 Save JSON</button>
            <button type="button" onclick="generateRandomTeams()" class="admin-only bg-slate-800/80 backdrop-blur hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm font-bold transition-all text-blue-400 flex-1 xl:flex-none">+ Gen Teams</button>
            <button type="button" onclick="autoResolveMatches()" class="admin-only bg-purple-900/40 backdrop-blur hover:bg-purple-800/60 border border-purple-600/60 px-3 py-2 rounded-lg text-xs md:text-sm font-bold transition-all text-purple-300 shadow-[0_0_15px_rgba(147,51,234,0.3)] w-full sm:w-auto xl:flex-none">⚡ Auto-Resolve</button>
            <button type="button" id="mainActionBtn" onclick="advanceTournament()" class="admin-only bg-emerald-600 hover:bg-emerald-500 px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(16,185,129,0.4)] active:scale-95 text-white w-full sm:w-auto xl:flex-none text-sm md:text-base">START STAGE</button>
        </div>
    </header>

    <section class="glass-panel p-1 md:p-2 rounded-2xl md:rounded-3xl relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-red-900/10 via-transparent to-emerald-900/10 pointer-events-none"></div>
        <div class="flex flex-col sm:flex-row justify-between items-center px-4 md:px-6 py-3 md:py-4 relative z-20 gap-3 border-b border-slate-700/30">
            <h2 class="text-sm md:text-lg font-black text-slate-200 uppercase tracking-widest flex items-center gap-2 md:gap-3">
                <span id="vizTourneyName">SWISS TOURNAMENT</span> 
                <span id="vizPhaseTag" class="text-emerald-400 bg-emerald-900/30 border border-emerald-500/30 px-2 md:px-3 py-1 rounded-full text-[10px] md:text-xs shadow-[0_0_10px_rgba(16,185,129,0.2)]">SWISS STAGE</span>
            </h2>
            <div id="viewToggle" class="hidden flex bg-slate-800/80 p-1 rounded-lg border border-slate-700 shadow-md">
                <button type="button" id="btnViewSwiss" onclick="setViewPhase('swiss')" class="px-3 md:px-4 py-1 rounded text-[10px] md:text-xs font-bold transition-all">SWISS</button>
                <button type="button" id="btnViewLeague" onclick="setViewPhase('league')" class="hidden px-3 md:px-4 py-1 rounded text-[10px] md:text-xs font-bold transition-all">PROVE IT</button>
                <button type="button" id="btnViewPlayoffs" onclick="setViewPhase('playoffs')" class="px-3 md:px-4 py-1 rounded text-[10px] md:text-xs font-bold transition-all">PLAYOFFS</button>
            </div>
        </div>
        <div id="visualizerContainer" class="viz-scroll overflow-x-auto pt-8 px-6 sm:px-12 flex gap-4 md:gap-8 items-stretch min-h-[500px] relative z-10 w-full scroll-smooth">
            <div class="m-auto text-slate-500 italic font-medium text-sm tracking-wide">Awaiting Tournament Data...</div>
        </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-8 items-start">
        <div class="lg:col-span-4 space-y-4 md:space-y-6">
            <section id="entrySection" class="admin-only glass-panel p-4 rounded-2xl">
                <div class="flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input id="tName" type="text" placeholder="Team Name" class="flex-[2] bg-slate-950/50 border border-slate-700 rounded-lg px-3 py-2 outline-none focus:border-emerald-500 text-xs md:text-sm font-medium w-full text-white placeholder-slate-500">
                        <input id="tTag" type="text" placeholder="TAG" maxlength="3" class="w-16 bg-slate-950/50 border border-slate-700 rounded-lg px-2 py-2 outline-none text-xs md:text-sm text-center uppercase font-bold text-blue-400 placeholder-slate-500">
                    </div>
                    <div class="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-1 mt-2">Roster & Seed Generator</div>
                    <div id="playerInputs" class="space-y-2"></div>
                    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-700/50">
                        <button type="button" id="addPlayerBtn" onclick="addPendingPlayer()" class="text-xs font-bold text-emerald-400 hover:text-emerald-300 transition-colors bg-emerald-900/20 px-2 py-1 rounded border border-emerald-500/30">+ Add Sub (6th)</button>
                        <div class="text-xs text-slate-400 text-right">Team MMR: <span id="calcMMR" class="font-bold text-blue-400">0</span> <span id="calcRank" class="text-emerald-500 font-bold ml-1"></span></div>
                    </div>
                    <button type="button" onclick="addTeam()" class="w-full bg-blue-600 hover:bg-blue-500 px-4 py-2 mt-2 rounded-lg font-bold text-xs md:text-sm transition-all shadow-md uppercase tracking-widest">Add Team</button>
                </div>
            </section>
            
            <section class="glass-panel rounded-2xl overflow-hidden">
                <div class="p-3 bg-slate-950/50 text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-700/50 flex justify-between">
                    <span>Rank & Team</span>
                    <span class="mr-2">W-L | RND DIFF</span>
                </div>
                <div id="standingsList" class="divide-y divide-slate-800/50 max-h-[400px] md:max-h-[600px] overflow-y-auto viz-scroll pb-2"></div>
            </section>
        </div>

        <div class="lg:col-span-8 space-y-4 md:space-y-6">
            <div class="glass-panel rounded-2xl p-3 md:p-4 flex flex-col sm:flex-row justify-between items-center text-center sm:text-left gap-2">
                <div>
                    <span id="phaseTag" class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-emerald-500">Phase</span>
                    <h2 id="roundDisplay" class="text-xl md:text-2xl font-black mt-1 tracking-tight">Setup</h2>
                </div>
            </div>
            <div id="matchGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-3 md:gap-4">
                <div class="col-span-full p-8 md:p-12 text-center border-2 border-dashed border-slate-700/50 rounded-2xl md:rounded-3xl bg-slate-900/30 text-slate-400 text-sm md:text-base backdrop-blur-sm">Awaiting Matchups</div>
            </div>
        </div>
    </div>
</div>

<div id="vetoModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[200] flex items-center justify-center p-2 md:p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[95vh] flex flex-col overflow-hidden shadow-[0_0_50px_rgba(0,0,0,1)]">
        <div class="bg-slate-800 p-3 md:p-4 border-b border-slate-700 flex justify-between items-center shrink-0">
            <h3 class="text-base md:text-xl font-black text-white uppercase tracking-widest flex items-center gap-2 md:gap-3">Map Veto</h3>
            <button type="button" onclick="closeVetoModal()" class="text-slate-400 hover:text-white transition-colors p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-3 md:p-6 bg-[#0b0f19] flex flex-col gap-4 md:gap-6 overflow-y-auto viz-scroll">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 md:gap-4">
                <div class="flex items-center gap-2 md:gap-4 text-lg md:text-2xl font-black uppercase text-center w-full sm:w-auto justify-center">
                    <span id="vetoTeam1" class="text-blue-400 drop-shadow-[0_0_5px_rgba(96,165,250,0.5)] truncate max-w-[120px] sm:max-w-[200px]"></span>
                    <span class="text-slate-600 text-xs md:text-sm">VS</span>
                    <span id="vetoTeam2" class="text-red-400 drop-shadow-[0_0_5px_rgba(248,113,113,0.5)] truncate max-w-[120px] sm:max-w-[200px]"></span>
                </div>
                <div class="flex gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 w-full sm:w-auto justify-center">
                    <button type="button" id="btnBo1" onclick="setVetoFormat('bo1')" class="px-4 md:px-5 py-1.5 rounded font-bold text-xs md:text-sm transition-all flex-1 sm:flex-none">BO1</button>
                    <button type="button" id="btnBo3" onclick="setVetoFormat('bo3')" class="px-4 md:px-5 py-1.5 rounded font-bold text-xs md:text-sm transition-all flex-1 sm:flex-none">BO3</button>
                </div>
            </div>
            <div id="vetoStatus" class="text-center text-sm md:text-xl bg-slate-800/80 py-2 md:py-3 rounded-lg border border-slate-700 shadow-inner font-black uppercase tracking-widest px-2"></div>
            <div id="vetoMapsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 md:gap-4"></div>
        </div>
        <div class="bg-slate-800 p-3 md:p-4 border-t border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0">
            <button type="button" onclick="resetVeto()" class="text-red-400 hover:text-red-300 font-bold text-xs md:text-sm flex items-center justify-center gap-1 bg-red-900/20 px-4 py-2 rounded border border-red-500/30 transition-colors w-full sm:w-auto">Reset Veto</button>
            <button type="button" onclick="closeVetoModal()" class="bg-emerald-600 hover:bg-emerald-500 px-6 md:px-8 py-2 md:py-2.5 rounded-lg text-white font-bold transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] text-xs md:text-sm w-full sm:w-auto">Confirm & Close</button>
        </div>
    </div>
</div>

<div id="rankModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[250] flex items-center justify-center p-2 md:p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-[0_0_40px_rgba(0,0,0,1)]">
        <div class="bg-slate-800 p-3 md:p-4 border-b border-slate-700 flex justify-between items-center shrink-0">
            <h3 class="text-base md:text-xl font-black text-white uppercase tracking-widest">Select Player Rank</h3>
            <button type="button" onclick="closeRankModal()" class="text-slate-400 hover:text-white transition-colors p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="rankModalGrid" class="p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 overflow-y-auto viz-scroll bg-[#0b0f19]"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
  apiKey: "AIzaSyDHgel5YFWgl7uJzW14Iu3ameFnkxzize4",
  authDomain: "dakshh-swiss-trial-f52fa.firebaseapp.com",
  databaseURL: "https://dakshh-swiss-trial-f52fa-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dakshh-swiss-trial-f52fa",
  storageBucket: "dakshh-swiss-trial-f52fa.firebasestorage.app",
  messagingSenderId: "797986639714",
  appId: "1:797986639714:web:ee69e0cd6e20efb1d1263b"
};
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let isLive = false;
    let isAdmin = false;
    let currentRoomCode = null;
    let currentAdminKey = null;

    let tournamentName = "SWISS TOURNAMENT";
    let tournamentFormat = 'standard';
    let swingCount = 0;
    
    let phase = 'swiss'; 
    let viewPhase = 'swiss';
    let teams = [];
    let matches = [];
    let currentRound = 0;
    let playoffMatches = { qf: [], sf: [], final: null, third: null };

    function sanitizeState() {
        if (teams && !Array.isArray(teams)) teams = Object.values(teams);
        if (matches && !Array.isArray(matches)) matches = Object.values(matches);
        teams = teams || []; matches = matches || [];
        
        if (!playoffMatches) playoffMatches = { qf: [], sf: [], final: null, third: null };
        if (playoffMatches.qf && !Array.isArray(playoffMatches.qf)) playoffMatches.qf = Object.values(playoffMatches.qf);
        if (playoffMatches.sf && !Array.isArray(playoffMatches.sf)) playoffMatches.sf = Object.values(playoffMatches.sf);
        playoffMatches.qf = playoffMatches.qf || []; playoffMatches.sf = playoffMatches.sf || [];

        teams.forEach(t => {
            t.history = t.history ? (Array.isArray(t.history) ? t.history : Object.values(t.history)) : [];
            t.players = t.players ? (Array.isArray(t.players) ? t.players : Object.values(t.players)) : [];
        });
        matches.forEach(m => {
            if (m.veto) m.veto.history = m.veto.history ? (Array.isArray(m.veto.history) ? m.veto.history : Object.values(m.veto.history)) : [];
            m.mapScores = m.mapScores ? (Array.isArray(m.mapScores) ? m.mapScores : Object.values(m.mapScores)) : [];
        });
        const allP = [...(playoffMatches.qf || []), ...(playoffMatches.sf || []), playoffMatches.final, playoffMatches.third].filter(Boolean);
        allP.forEach(m => {
            if (m.veto) m.veto.history = m.veto.history ? (Array.isArray(m.veto.history) ? m.veto.history : Object.values(m.veto.history)) : [];
            m.mapScores = m.mapScores ? (Array.isArray(m.mapScores) ? m.mapScores : Object.values(m.mapScores)) : [];
        });
    }

    window.onload = () => {
        const offlineData = localStorage.getItem('dakshh_offline_data');
        if (offlineData) {
            try {
                const state = JSON.parse(offlineData);
                tournamentName = state.tournamentName || "SWISS TOURNAMENT";
                tournamentFormat = state.tournamentFormat || 'standard';
                swingCount = state.swingCount || 0;
                phase = state.phase || 'swiss';
                viewPhase = state.viewPhase || phase;
                teams = state.teams || [];
                matches = state.matches || [];
                currentRound = state.currentRound || 0;
                playoffMatches = state.playoffMatches || { qf: [], sf: [], final: null, third: null };
                
                sanitizeState();
                isAdmin = true; isLive = false;
                
                document.getElementById('roomCodeContainer').classList.add('hidden');
                document.body.classList.remove('viewer-mode');
                localStorage.removeItem('dakshh_offline_data');
                render();
            } catch (e) { window.location.href = "index.html"; }
            return;
        }

        const savedRoom = localStorage.getItem('dakshh_room');
        const savedAdminStatus = localStorage.getItem('dakshh_admin');
        const savedAdminKey = localStorage.getItem('dakshh_adminKey');
        
        if (savedRoom) {
            currentRoomCode = savedRoom;
            isLive = true;
            isAdmin = savedAdminStatus === 'true';
            if(isAdmin && savedAdminKey) currentAdminKey = savedAdminKey;
            
            document.getElementById('roomCodeDisplay').innerText = currentRoomCode;
            if(isAdmin && currentAdminKey) document.getElementById('adminKeyDisplay').innerText = currentAdminKey;
            
            document.getElementById('roomCodeContainer').classList.remove('hidden');
            document.getElementById('roomCodeContainer').classList.add('flex');
            document.getElementById('liveIndicator').classList.remove('hidden');
            document.getElementById('liveIndicator').classList.add('flex');
            
            if (!isAdmin) document.body.classList.add('viewer-mode');
            
            startDatabaseListener();
        } else {
            window.location.href = "index.html";
        }
        
        if (isAdmin && teams.length === 0) renderTeamForm();
    };

    function startDatabaseListener() {
        db.ref('tournaments/' + currentRoomCode).on('value', (snapshot) => {
            const state = snapshot.val();
            if (state) {
                if (state.phase && state.phase !== phase) { viewPhase = state.phase; }
                
                const oldMatches = matches;
                const oldPlayoffs = playoffMatches;

                tournamentName = state.tournamentName || "SWISS TOURNAMENT";

    function loadTournament(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (!confirm("SAFEGUARD WARNING: Are you sure you want to completely overwrite the current tournament with this backup file?")) {
            event.target.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const state = JSON.parse(e.target.result);
                tournamentName = state.tournamentName || "SWISS TOURNAMENT";
                tournamentFormat = state.tournamentFormat || 'standard';
                swingCount = state.swingCount || 0;
                phase = state.phase || 'swiss';
                viewPhase = state.viewPhase || phase;
                teams = state.teams || [];
                matches = state.matches || [];
                currentRound = state.currentRound || 0;
                playoffMatches = state.playoffMatches || { qf: [], sf: [], final: null, third: null };
                
                sanitizeState();
                calculateStats();
                
                const tournamentState = { tournamentName, tournamentFormat, swingCount, phase, viewPhase, teams, matches, currentRound, playoffMatches };
                
                if (isLive && isAdmin && currentRoomCode) {
                    if (currentAdminKey) tournamentState.adminKey = currentAdminKey;
                    db.ref('tournaments/' + currentRoomCode).set(tournamentState).then(() => {
                        alert("Safeguard Successful: Backup restored across all live screens!");
                    });
                } else if (!isLive && isAdmin) {
                    localStorage.setItem('dakshh_offline_data', JSON.stringify(tournamentState));
                    render();
                    alert("Safeguard Successful: Offline backup restored!");
                }
            } catch (err) { alert("Invalid JSON file format"); }
        };
        reader.readAsText(file);
        event.target.value = ""; 
    }

    function saveTournament() {
        try {
            if (isAdmin) preserveInputs();
            const state = { 
                tournamentName: tournamentName || "SWISS TOURNAMENT", 
                tournamentFormat: tournamentFormat || "standard", 
                swingCount: swingCount || 0,

                currentRound: currentRound || 0, 
                playoffMatches: playoffMatches || { qf: [], sf: [], final: null, third: null }
            };
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            let safeName = (tournamentName || "Tournament").replace(/[^a-z0-9]/gi, '_').toLowerCase();
            a.download = `${safeName}_R${currentRound || 0}.json`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        } catch (err) { alert("Failed to save the file."); }
    }

    function calculateStackMMR(ranks) {
        if (ranks.length === 0) return { mmr: 0, predicted: "Unrated" };
        const mmrs = ranks.map(r => RANK_DATA[r].mmr);
        const avg = mmrs.reduce((a, b) => a + b, 0) / mmrs.length;
        const highest = Math.max(...mmrs);
        const spread = highest - Math.min(...mmrs);
        const adjusted_mmr = avg + ((highest - avg) * 0.25) + (spread * 0.10) + (ranks.length === 5 ? 25 : (ranks.length === 6 ? 35 : 0));
        let closest_rank = null, closest_diff = Infinity;
        for (const [r, data] of Object.entries(RANK_DATA)) {
            const diff = Math.abs(adjusted_mmr - data.mmr);
            if (diff < closest_diff) { closest_diff = diff; closest_rank = r; }
        }
        return { mmr: Math.round(adjusted_mmr), predicted: closest_rank };
    }

        const pseudoNames = ["ElevenZ","nay","gaspass","Toaster","Turkey","Bionicle","Betajer","Pinggg","f0rgotteN","nothing","TaCo","Tekken","Angel2","m0m","tent","violin","twig","Defeat","smashies","Starved","qUeeN","pANcake","More","Bats","Bluegar","WhispeR","Syruppi","Tardis","cBed","Zipper","Meow","SPAGHETTI","flapr","ShaBAM","HealtHy","Geico","Hakuna","boom","Pyro","Celsius","janeqt","Nerfio","PbJ","solar","Toothgemo","B0T","Methan","Mex","web","aeiou","Donotplayer","zeta","Pumpkin","Comet","M0del","Nokia","Karen","Bossi","whiff","AimPunch","Iron1Demon","BotFrag","NoKevlar","DropVandal","HealMeSage","JettReviveMe","LagSpike","HighPing","AltTab","WallBang", "LineupLarry", "OdinAbuser", "InstalockReyna", "FF15", "ShiftWalker", "CrouchGamer", "ViperMains", "SmurfAccount", "RankedDemon", "Hardstuck", "IronSlayer", "NeonSlider", "BrimLineups"];
        const rankKeys = Object.keys(RANK_DATA);
        const shuffledNames = [...pseudoNames].sort(() => Math.random() - 0.5);
        let nameIdx = 0;

        let currentSwings = teams.filter(t => t.isSwing).length;
        let neededSwings = isMod ? Math.max(0, swingCount - currentSwings) : 0;
        const startIndex = teams.length;

        for(let i=0; i<teamsToAdd; i++) {

    function calculateStats() {
        teams.forEach(t => { 
            t.wins = 0; t.losses = 0; t.roundsWon = 0; t.roundsLost = 0; t.mapsWon = 0; t.mapsLost = 0; t.history = []; 
        });
        
        matches.forEach(m => {
            if (m.winnerId && m.mapScores) {
                const t1 = teams.find(t => t.id === m.t1.id);
                const t2 = teams.find(t => t.id === m.t2.id);
                if (t1 && t2) {
                    let t1M = 0, t2M = 0;
                    m.mapScores.forEach(score => {
                        if (m.type === 'swiss' || m.type === 'playoff') {
                            t1.roundsWon += score.s1; t1.roundsLost += score.s2;
                            t2.roundsWon += score.s2; t2.roundsLost += score.s1;
                        }
                        if (score.s1 > score.s2) t1M++; else t2M++;
                    });

                    if (m.type === 'swiss') {
                        if (m.winnerId === t1.id) { t1.wins++; t2.losses++; } else { t2.wins++; t1.losses++; }
                        t1.history.push(t2.id); t2.history.push(t1.id);
                        t1.mapsWon += t1M; t1.mapsLost += t2M; t2.mapsWon += t2M; t2.mapsLost += t1M;
                    }
                }
            }
        });

        teams.forEach(t => {
            t.buchholz = t.history.reduce((acc, oppId) => {
                const opp = teams.find(team => team.id === oppId);
                return acc + (opp ? (opp.wins - opp.losses) : 0);
            }, 0);
            t.roundDiff = t.roundsWon - t.roundsLost;
            
            if (tournamentFormat === 'standard') {
                if (t.wins >= 3) t.status = 'qualified';
                else if (t.losses >= 3) t.status = 'eliminated';
                else t.status = 'active';
            } else if (tournamentFormat === 'modified') {
                if (phase === 'swiss') {
                    if (t.losses === 2 && currentRound <= 3) t.status = 'eliminated';
                    else t.status = 'active'; 
                }
            }
        });
    }

    function getSortedTeams() {
        calculateStats(); 
        return [...teams].sort((a, b) => {
            if (tournamentFormat === 'modified' && phase !== 'swiss') {
                const getTier = (t) => {
                    if (t.isSwing) return 0;
                    if (t.status === 'qualified') return 5;          
                    if (t.status === 'qualified_league') return 4;   
                    if (t.status === 'league') return 3;             
                    if (t.status === 'eliminated_league') return 2;  
                    return 1;                                        
                };
                const tierA = getTier(a);
                const tierB = getTier(b);
                if (tierA !== tierB) return tierB - tierA; 
            }

            if (tournamentFormat === 'modified' && (phase === 'league' || phase === 'playoffs')) {
                if (a.status === 'qualified_league' && b.status === 'qualified_league') {
                    if (a.leagueRank && b.leagueRank) return a.leagueRank - b.leagueRank;
                }
                if (a.status === 'league' && b.status === 'league') {
                    if (a.playinSeed && b.playinSeed) return a.playinSeed - b.playinSeed;
                }
            }

            if (b.wins !== a.wins) return b.wins - a.wins;
            if (a.losses !== b.losses) return a.losses - b.losses;
            if (b.roundDiff !== a.roundDiff) return b.roundDiff - a.roundDiff;
            if (b.buchholz !== a.buchholz) return b.buchholz - a.buchholz;
            return b.initialSeed - a.initialSeed;
        });
    }

    function getMatchById(id) {
        let m = matches.find(x => x.id === id);
        if (m) return m;
        const allP = [...(playoffMatches.qf || []), ...(playoffMatches.sf || []), playoffMatches.final, playoffMatches.third].filter(Boolean);
        return allP.find(x => x && x.id === id);
    }
